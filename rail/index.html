<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<meta name="description" content="東京・大阪・名古屋・福岡・札幌・京都の路線図。主要路線の全駅を載せています。">
<title>路線図</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<header class="bar">
  <button id="btn-back" class="icon-btn" title="もどる" aria-label="もどる">◀</button>
  <div class="bar-title"><span class="logo">🚃</span><h1 id="bar-title">路線図</h1></div>
  <button id="btn-reset" class="icon-btn" title="表示をもとに戻す" aria-label="表示をもとに戻す">⟳</button>
</header>

<main class="wrap">
  <nav class="switch" id="city-switch" aria-label="都市の切り替え"></nav>
  <p class="unit-lead" id="city-lead"></p>
  <div id="stage" class="stage"></div>
  <div id="legend" class="legend"></div>
  <div id="panel" class="panel"></div>
  <p class="hint" id="hint"></p>

  <div class="card times"><h2>主要区間の所要時間</h2><div id="times"></div>
    <p class="small-note">乗車時間の目安です。乗り換えの歩きや待ち時間は含みません。</p></div>
  <div class="card facts"><h2>この街の路線の見方</h2><p id="facts"></p></div>
  <p class="foot" id="foot"></p>
</main>

<div id="toast" role="status" aria-live="polite"></div>

<script src="data-rail.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
